<script src="scripts/nav.js"></script>
<script src="scripts/dadosbuscador.js"></script>
<script>
// 1. Pegar o parâmetro "id" da URL
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get("id"));

  // 2. Buscar o ponto turístico no JSON carregado de dadosbuscador.js
  const ponto = data.pontosTuristicos.find(p => p.id === id);

  // 3. Preencher os elementos
  document.getElementById("nome").innerText = ponto.nome;
  document.getElementById("cidade").innerText = ponto.cidade;
  document.getElementById("historia").innerText = ponto.detalhes.historia;
  document.getElementById("descricaoCompleta").innerText = ponto.detalhes.descricaoCompleta;

  // 4. Preencher o mapa usando o texto salvo no JSON
  document.getElementById("mapa").src =
    `https://www.google.com/maps?q=${encodeURIComponent(ponto.detalhes.maps)}&output=embed`;

  // 5. Imagem principal
  document.getElementById("imagens-principal").style.backgroundImage = `url(${ponto.imagemPrincipal})`;

  // 6. Imagens extras
  // ponto.detalhes.maisImagens.forEach((img, index) => {
  //  const el = document.getElementById(`imagens-${index+1}`);
  //  if (el) el.style.backgroundImage = `url(${img})`;
  //});

  // 7. Avaliação geral
  document.getElementById("avaliacaogeral").innerHTML =
    `Avaliação Geral: <strong>${ponto.detalhes.avaliacao.media}</strong>`;

  // 8. Comentários
  const comentariosDiv = document.getElementById("comentarios");
  comentariosDiv.innerHTML = "<h2>Comentários</h2>";
  ponto.detalhes.avaliacao.comentarios.forEach(c => {
    comentariosDiv.innerHTML += `
      <div class="comentario">
        <div class="usuario-info">
          <h4>${c.usuario}</h4>
          <p>Nota: ${c.nota}</p>
        </div>
        <div class="comentario-texto">
          <p>"${c.texto}"</p>
        </div>
      </div>
    `;
  });
</script>
